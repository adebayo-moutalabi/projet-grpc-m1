syntax = "proto3";
package delivery;
option java_package = "fr.istic.grpc.delivery";

service DeliveryService {

  // 1 UNARY : création d'une commande par le livreur, le serveur lui renvoie confirmation + ID généré
  rpc CreateOrder (OrderRequest) returns (OrderResponse) {}

  // 2 SSTREAMING : le client s'abonne et reçoit la position GPS du livreur toutes les 10s
  rpc TrackDelivery (TrackRequest) returns (stream Position) {}

  // 3 CSTREAMING : le livreur envoie plusieurs photos, le serveur ACK une fois toutes reçues
  rpc UploadProof (stream Photo) returns (UploadAck) {}

  // 4 BIDISTREAMING : chat client/livreur pour en cas de problème
  rpc SupportChat (stream ChatMessage) returns (stream ChatMessage) {}
}

/////////////////////////////////////////////////////////////////////////////////////////////////////////

// CreateOrder

//req
message OrderRequest {
  string sender_address = 1;      //@ d'envoi
  string recipient_address = 2;   //@ de récep
  string item_description = 3;    //description objet
}

//rep
message OrderResponse {
  string order_id = 1;      //id de la commande
  bool confirmed = 2;       //confirmation si le serveur a réussi à créer la commande
}


/////////////////////////////////////////////////////////////////////////////////////////////////////////

// TrackDelivery 

message TrackRequest {
  string order_id = 1;      //l'id du colis que le client veut suivre
}

message Position {
  double latitude = 1;      //les coordonnées (générées) du livreur envoyées au client
  double longitude = 2;
}

/////////////////////////////////////////////////////////////////////////////////////////////////////////

// UploadProof

message Photo {
  string order_id = 1;      //l'id du colis
  string filename = 2;      //le nom de la photo que le client envoie, par ex: "photo1.png" (pour simplifier)
}

message UploadAck {
  int32 photos_received = 1;    //nombre de photos reçues du livreur
}

/////////////////////////////////////////////////////////////////////////////////////////////////////////

// SupportChat 

message ChatMessage {
  string order_id = 1;
  string sender = 2;   // "client" ou "livreur"
  string content = 3;
}